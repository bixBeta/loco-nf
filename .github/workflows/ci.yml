name: ci

# Front-end checks. loco-pipe itself is not run here: CI points --locopipebin at
# a fake CLI that enforces the same contracts, so the tables and flags this
# pipeline generates are checked without needing the image or real data.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  stub:
    name: front-end (NF ${{ matrix.nxf_ver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25.04.1 is what the server runs. Nextflow 26 ships a strict script
        # syntax that rejects top level statements, so the flat layout used
        # across the bixBeta pipelines (params + if(params.help) + banner at
        # file scope) will not compile there. Pinned deliberately until that
        # style question is settled for all the pipelines at once.
        nxf_ver: [ '25.04.1' ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nxf_ver }}

      - name: Generate test data
        run: bash test/make_test_data.sh

      # First, and on its own, because everything below runs `nextflow config`
      # and a config that does not parse makes them all fail with whatever they
      # happened to be grepping for rather than the actual error.
      - name: Config parses
        run: |
          set -euo pipefail
          set +e
          out=$(nextflow config . 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ] ; then
            echo "nextflow.config failed to parse:"
            echo "$out" | tail -20
            exit 1
          fi
          echo "config parses"

      - name: params.yaml is in step with the defaults
        run: |
          pip install --quiet pyyaml
          python test/check_params_yaml.py

      - name: loco-params.yaml lists every loco-pipe setting
        run: python test/check_loco_params.py

      - name: Retry policy applies to every process
        run: |
          set -euo pipefail
          # resolved config, not the source, so a withName block that silently
          # overrode the global setting would show up here
          nextflow config . | grep -q 'maxRetries'    || { echo "maxRetries missing"; exit 1; }
          nextflow config . | grep -q 'errorStrategy' || { echo "errorStrategy missing"; exit 1; }
          nextflow config . | grep -q 'maxForks'      || { echo "maxForks missing"; exit 1; }

      - name: Singularity engine resolves the sif path
        run: |
          set -euo pipefail
          # default engine is singularity: the container directive must point at
          # a local .sif, and nothing may reference a registry
          cfg=$(nextflow config .)
          echo "$cfg" | grep -q 'file:///workdir/TREx_shared/projects/loco-pipe.sif' || {
            echo "$cfg" | grep -i container; echo "sif path not resolved"; exit 1; }
          # The analysis image must be local. The report image is deliberately a
          # registry reference: quarto lives in the sartools image, not in
          # loco-pipe.sif. So every container directive EXCEPT that one must be
          # local, compared against the resolved value rather than a block name.
          qmd=$(echo "$cfg" | sed -n "s/^ *qmdimage *= *'\(.*\)'.*/\1/p" | head -1)
          [ -n "$qmd" ] || { echo "qmdimage not resolved"; exit 1; }
          if echo "$cfg" | grep -E "^\s*container = " | grep -vF "$qmd" \
               | grep -qE 'docker://|ghcr.io|quay.io' ; then
            echo "$cfg" | grep -E "^\s*container = "
            echo "an analysis container references a registry"; exit 1
          fi
          echo "sif resolution OK"

      # The bams are passed to loco-pipe as text, not staged, so autoMounts
      # cannot bind them. Whatever the sheet references has to be bound here or
      # the image cannot read the data.
      # `nextflow config` takes no pipeline params, so the resolved bind list is
      # read off the banner of a stub run instead, which is also where an
      # operator sees it.
      - name: Sheet and reference directories are bound
        run: |
          set -euo pipefail
          set +e
          out=$(nextflow run . -stub-run -c test/ci.config --report true \
                  --sheet test/sample-sheet.csv --ref "$PWD/test/ref/ref.fa" 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ] ; then echo "$out" | tail -40 ; exit 1 ; fi
          binds=$(echo "$out" | grep '^binds' || true)
          echo "$binds"
          # The requirement is that a directory is REACHABLE inside the image,
          # not that it appears verbatim: redundant binds are collapsed, so a
          # path covered by an ancestor is bound just as effectively.
          covered() {
            for o in $(echo "$binds" | tr ' ' '\n' | grep '^/') ; do
              [ "$1" = "$o" ] && return 0
              [ "${1#$o/}" != "$1" ] && return 0
            done
            return 1
          }
          covered "$PWD/test/bams" || { echo "bam directory not reachable"; exit 1; }
          covered "$PWD/test/ref"  || { echo "reference directory not reachable"; exit 1; }
          # the site defaults must survive
          echo "$binds" | grep -q -- '-B /local'   || { echo "/local bind lost"; exit 1; }
          echo "$binds" | grep -q -- '-B /workdir' || { echo "/workdir bind lost"; exit 1; }
          echo "binds OK"

      - name: A missing sheet does not break config parsing
        run: |
          set -euo pipefail
          # --help and first-time runs have no sheet; the bind logic must not throw
          set +e
          out=$(nextflow run . --help --sheet /no/such/sheet.csv 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ] ; then echo "$out" | tail -40 ; exit 1 ; fi
          nextflow config . > /dev/null
          echo "config parses without a sheet"

      - name: Help text
        run: nextflow run . --help

      # Listing contigs must work with nothing but a reference: no image, no
      # sheet. It is how you decide what to analyse in the first place.
      - name: List contigs
        run: |
          set -euo pipefail
          # set +e around the capture so a failing run prints instead of
          # aborting the step silently
          set +e
          out=$(nextflow run . --ref test/ref/ref.fa --listContigs 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ] ; then echo "$out" | tail -40 ; exit 1 ; fi
          echo "$out" | grep -q 'chr_big'        || { echo "$out" | tail -20; exit 1; }
          echo "$out" | grep -q 'below --minlen' || { echo "$out" | tail -20; echo "minlen not reported"; exit 1; }

      # Non blocking: reports what the v2 strict parser makes of the pipeline,
      # so the gap is visible before it becomes mandatory.
      - name: Strict syntax (NXF_SYNTAX_PARSER=v2) report
        continue-on-error: true
        run: |
          set +e
          echo "############ config ############"
          NXF_SYNTAX_PARSER=v2 nextflow config . > /tmp/v2cfg.txt 2>&1
          echo "exit=$?"
          grep -viE 'unrecognized config option' /tmp/v2cfg.txt | grep -iE 'error|warn' | head -20

          echo
          echo "############ script ############"
          NXF_SYNTAX_PARSER=v2 nextflow run . --help > /tmp/v2run.txt 2>&1
          echo "exit=$?"
          grep -vE 'Unrecognized config option' /tmp/v2run.txt | grep -iE '^error|error:|cannot|not allowed|invalid|unexpected' | head -40
          exit 0

      # ---- sample sheet validation, all expected to fail at launch ----------

      - name: A missing reference index is caught up front
        run: |
          set -euo pipefail
          cp test/ref/ref.fa test/ref/noindex.fa
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
                  --ref "$PWD/test/ref/noindex.fa" --locopipebin "$PWD/test/bin/loco-pipe" 2>&1) \
            && { echo "expected failure"; exit 1; }
          echo "$out" | grep -q 'No fasta index at' || { echo "$out" | tail -20; exit 1; }
          echo "$out" | grep -q 'samtools faidx'    || { echo "$out" | tail -20; echo "no fix suggested"; exit 1; }

      - name: A duplicated sample name is rejected
        run: |
          set -euo pipefail
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet-dup.csv \
                  --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" 2>&1) \
            && { echo "expected failure"; exit 1; }
          echo "$out" | grep -q "appears more than once" || { echo "$out" | tail -20; exit 1; }

      - name: A missing bam is named
        run: |
          set -euo pipefail
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet-missingbam.csv \
                  --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" 2>&1) \
            && { echo "expected failure"; exit 1; }
          echo "$out" | grep -q 'S1: no bam at' || { echo "$out" | tail -20; exit 1; }

      # 'label' is what the other bixBeta pipelines call this column, so a sheet
      # written for those must work here too.
      - name: A sheet using the house 'label' column is accepted
        env:
          CI_CAPTURE: ${{ github.workspace }}/ci-capture-label
        run: |
          set -euo pipefail
          rm -rf "$CI_CAPTURE" label_outdir
          nextflow run . -c test/ci.config --sheet test/sample-sheet-label.csv \
            --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" \
            --outdir label_outdir --threads 2
          grep -qx "$(printf 'S1\t%s/test/bams/S1.bam\talpha' "$PWD")" "$CI_CAPTURE/samples.tsv" \
            || { cat "$CI_CAPTURE/samples.tsv"; echo "label column not used as the sample name"; exit 1; }
          rm -rf label_outdir
          echo "label column OK"

      # Bams symlinked into a previous pipeline's work dirs resolve to one
      # canonical path each, so the bind list grew with the sample count even
      # though every one was already under /local.
      - name: Redundant binds are collapsed
        run: |
          set -euo pipefail
          set +e
          out=$(nextflow run . -stub-run -c test/ci.config \
                  --sheet test/sample-sheet.csv --ref "$PWD/test/ref/ref.fa" 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ] ; then echo "$out" | tail -30 ; exit 1 ; fi
          binds=$(echo "$out" | grep '^binds' || true)
          echo "$binds"
          # nothing under a directory that is itself bound
          for d in $(echo "$binds" | tr ' ' '\n' | grep '^/' ) ; do
            for o in $(echo "$binds" | tr ' ' '\n' | grep '^/' ) ; do
              if [ "$d" != "$o" ] && [ "${d#$o/}" != "$d" ] ; then
                echo "$d is already covered by $o"; exit 1
              fi
            done
          done
          echo "binds collapsed OK"

      - name: A missing column is named, with what was found
        run: |
          set -euo pipefail
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet-nogroup.csv \
                  --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" 2>&1) \
            && { echo "expected failure"; exit 1; }
          echo "$out" | grep -q "missing required column 'group'" || { echo "$out" | tail -20; exit 1; }

      - name: A missing image is reported with the resolved path
        run: |
          set -euo pipefail
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
                  --ref "$PWD/test/ref/ref.fa" --sifdir "$PWD/nosuchdir" 2>&1) \
            && { echo "expected failure"; exit 1; }
          echo "$out" | grep -q 'No loco-pipe image at' || { echo "$out" | tail -20; exit 1; }
          echo "$out" | grep -q 'build-sif.sh'          || { echo "$out" | tail -20; echo "no fix suggested"; exit 1; }

      # ---- the real thing, against the fake CLI ------------------------------

      - name: Tables are generated exactly as loco-pipe reads them
        env:
          CI_CAPTURE: ${{ github.workspace }}/ci-capture
        run: |
          set -euo pipefail
          rm -rf "$CI_CAPTURE" locopipe
          nextflow run . -c test/ci.config \
            --sheet test/sample-sheet.csv \
            --ref   "$PWD/test/ref/ref.fa" \
            --locopipebin "$PWD/test/bin/loco-pipe" \
            --id    CI_TEST --threads 2

          # print what was actually captured before asserting on it, so a failed
          # assertion is diagnosable from the log alone
          show() { echo "--- $1 ---"; cat "$CI_CAPTURE/$1" 2>&1 || true; echo "---"; }
          fail() { echo "ASSERTION FAILED: $1"; show samples.tsv; show contigs.tsv; show start.command.txt; exit 1; }

          # the header loco-pipe expects, and the sheet's groups carried across
          head -1 "$CI_CAPTURE/samples.tsv" | grep -qx "$(printf 'sample_name\tbam\tpopulation')" \
            || fail "samples.tsv header"
          grep -qx "$(printf 'S1\t%s/test/bams/S1.bam\talpha' "$PWD")" "$CI_CAPTURE/samples.tsv" \
            || fail "S1 row"
          grep -qx "$(printf 'S4\t%s/test/bams/S4.bam\tbeta'  "$PWD")" "$CI_CAPTURE/samples.tsv" \
            || fail "S4 row"
          [ "$(grep -c . "$CI_CAPTURE/samples.tsv")" -eq 5 ] \
            || fail "expected header + 4 samples"

          # contigs: chr_small is below the default minlen and must be dropped.
          # The table now carries a second column of short plot labels, so
          # compare on the first field.
          cut -f1 "$CI_CAPTURE/contigs.tsv" | grep -qx 'chr_big' || fail "chr_big missing"
          cut -f1 "$CI_CAPTURE/contigs.tsv" | grep -qx 'chr_mid' || fail "chr_mid missing"
          if cut -f1 "$CI_CAPTURE/contigs.tsv" | grep -qx 'chr_small' ; then
            fail "chr_small should be below --minlen"
          fi
          # the short label keeps facet strips readable instead of truncating
          # the full contig name
          grep -qx "$(printf 'chr_big\tbig')" "$CI_CAPTURE/contigs.tsv" \
            || fail "no short plot label for chr_big" 

          # -@ matches what nextflow reserved, not a hardcoded number
          grep -qx -- '2' "$CI_CAPTURE/start.command.txt" || fail "-@ did not match task.cpus"

          # An unset --lococonfig must leave the generated config alone. The
          # value still writes a newline into the task dir, and [ -s ] calls a
          # 1 byte file non-empty, so this once wiped locopipe.yaml.
          grep -q 'basedir' locopipe/locopipe.yaml \
            || { echo "the generated config was clobbered by an unset --lococonfig"; exit 1; }

          # init takes the bam files as SAMPLES; passing anything else ( the
          # reference, say ) is rejected by the real CLI's BAMfile validator.
          # The reference must appear exactly once, as the value of -r; twice
          # means it was also passed positionally, which is the bug this guards.
          [ "$(grep -c '\.bam$' "$CI_CAPTURE/init.command.txt")" -eq 4 ] \
            || fail "init was not given the 4 bam files as SAMPLES"
          [ "$(grep -c 'ref\.fa$' "$CI_CAPTURE/init.command.txt")" -eq 1 ] \
            || fail "the reference was passed to init more than once"

          # init records the reference into locopipe.yaml, which a later task
          # reads, so it must be the real location and not this task's staged
          # symlink ( a bare "ref.fa" would resolve to the wrong task dir )
          grep -qx "$PWD/test/ref/ref.fa" "$CI_CAPTURE/init.command.txt" \
            || fail "init was given a staged reference rather than its real path"
          echo "table generation OK"

          # versions.yml comes out of a heredoc in the middle of the script. If
          # its terminator ever stops matching, the heredoc swallows the rest of
          # the script and the failure is reported as something unrelated, so
          # check the artefact itself.
          python -c "
          import sys, yaml
          d = yaml.safe_load(open('pipeline_info/versions.yml'))
          assert isinstance(d, dict) and d, f'versions.yml is not a mapping: {d!r}'
          key = next(iter(d))
          assert 'snakemake' in d[key], f'no snakemake version recorded: {d!r}'
          print('versions.yml OK:', d)
          "

      # A relative bam path validates fine at launch but would be unusable from
      # a task working directory, so it has to be absolute in samples.tsv.
      - name: Relative bam paths are made absolute
        env:
          CI_CAPTURE: ${{ github.workspace }}/ci-capture-relpath
        run: |
          set -euo pipefail
          rm -rf "$CI_CAPTURE" locopipe
          { echo "sample,bam,group"
            echo "S1,test/bams/S1.bam,alpha"
            echo "S2,test/bams/S2.bam,beta"; } > test/sample-sheet-relative.csv
          nextflow run . -c test/ci.config \
            --sheet test/sample-sheet-relative.csv --ref "$PWD/test/ref/ref.fa" \
            --locopipebin "$PWD/test/bin/loco-pipe" --threads 2
          grep -qx "$(printf 'S1\t%s/test/bams/S1.bam\talpha' "$PWD")" "$CI_CAPTURE/samples.tsv" \
            || { cat "$CI_CAPTURE/samples.tsv"; echo "bam path not absolute"; exit 1; }
          echo "relative paths resolved"

      # Two contigs that shorten to the same label would be plotted under one
      # facet, mislabelling the figure rather than merely looking untidy.
      - name: Colliding short labels fall back to full contig names
        env:
          CI_CAPTURE: ${{ github.workspace }}/ci-capture-collide
        run: |
          set -euo pipefail
          rm -rf "$CI_CAPTURE" collide_outdir
          nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
            --ref "$PWD/test/ref/collide.fa" --locopipebin "$PWD/test/bin/loco-pipe" \
            --outdir collide_outdir --minlen 100 --threads 2
          cat "$CI_CAPTURE/contigs.tsv"
          # chr_1 and scaffold_1 both shorten to "1", so neither may be labelled "1"
          grep -qx "$(printf 'chr_1\tchr_1')"           "$CI_CAPTURE/contigs.tsv" \
            || { echo "chr_1 was not disambiguated"; exit 1; }
          grep -qx "$(printf 'scaffold_1\tscaffold_1')" "$CI_CAPTURE/contigs.tsv" \
            || { echo "scaffold_1 was not disambiguated"; exit 1; }
          rm -rf collide_outdir
          echo "label collision OK"

      - name: An explicit contig list wins over minlen
        env:
          CI_CAPTURE: ${{ github.workspace }}/ci-capture-contigs
        run: |
          set -euo pipefail
          rm -rf "$CI_CAPTURE" locopipe
          printf 'chr_small\ttiny\n' > test/contigs.txt
          nextflow run . -c test/ci.config \
            --sheet test/sample-sheet.csv --ref "$PWD/test/ref/ref.fa" \
            --contigs "$PWD/test/contigs.txt" \
            --locopipebin "$PWD/test/bin/loco-pipe" --threads 2
          grep -q 'chr_small' "$CI_CAPTURE/contigs.tsv"
          ! grep -q 'chr_big' "$CI_CAPTURE/contigs.tsv"

      # Without this the run would simply analyse nothing, which is far harder
      # to notice than a failure.
      - name: A minlen that excludes every contig is an error
        run: |
          set -euo pipefail
          rm -rf locopipe
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
                  --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" \
                  --minlen 99999999 2>&1) \
            && { echo "expected failure"; exit 1; }
          echo "$out" | grep -q 'nothing to analyse' || { echo "$out" | tail -20; exit 1; }
          echo "$out" | grep -q 'longest is 2000000' || { echo "$out" | tail -20; echo "longest not reported"; exit 1; }

      - name: A single group warns but still runs
        run: |
          set -euo pipefail
          rm -rf locopipe
          set +e
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet-onegroup.csv \
                  --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" --threads 2 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ] ; then echo "$out" | tail -40 ; exit 1 ; fi
          echo "$out" | grep -q "every sample is in group" || { echo "$out" | tail -20; exit 1; }

      - name: --launch false stops after preparing
        run: |
          set -euo pipefail
          rm -rf locopipe
          set +e
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
                  --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" \
                  --launch false 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ] ; then echo "$out" | tail -40 ; exit 1 ; fi
          echo "$out" | grep -q 'without launching it' || { echo "$out" | tail -20; exit 1; }
          # the tables are written, so the grouping can be checked ...
          test -f locopipe/docs/samples.tsv || { echo "no samples.tsv"; exit 1; }
          test -f locopipe/locopipe.yaml    || { echo "no locopipe.yaml"; exit 1; }
          # ... but nothing was analysed
          if [ -d locopipe/figures ] ; then echo "loco-pipe ran despite --launch false"; exit 1 ; fi
          echo "launch gate OK"

      # snakemake keeps its state in --outdir, which is the point of putting it
      # outside work/: a second run continues rather than starting over.
      # Apptainer refuses to start when a bind source does not exist, and the
      # results directory is bound. CI has no containers, so it cannot reproduce
      # that failure - it can at least assert the workflow creates the directory
      # itself rather than leaving it to the task.
      - name: The results directory is created before the task runs
        run: |
          set -euo pipefail
          rm -rf fresh_outdir
          nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
            --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" \
            --outdir fresh_outdir --threads 2 --launch false
          test -d fresh_outdir || { echo "outdir was not created"; exit 1; }
          rm -rf fresh_outdir
          echo "outdir creation OK"

      # Two properties that make --outdir worth having. Both are easy to lose:
      # an unchanged rerun must not touch the tables ( snakemake reruns on mtime
      # ), and init must not clobber the settings file the operator edits.
      # Two properties that make --outdir worth having, and one that makes it
      # usable: an unchanged rerun must not touch the tables ( snakemake reruns
      # on mtime ), init must not clobber the settings file the operator edits,
      # and editing that file must actually reach the next run.
      - name: An unchanged rerun leaves the tables and settings alone
        run: |
          set -euo pipefail
          rm -rf reuse_outdir
          run() {
            nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
              --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" \
              --outdir reuse_outdir --threads 2 --launch false "$@" 2>&1
          }

          run > /dev/null
          before_s=$(stat -c %Y reuse_outdir/docs/samples.tsv)
          before_c=$(stat -c %Y reuse_outdir/docs/contigs.tsv)
          echo "# EDITED_BY_OPERATOR" >> reuse_outdir/locopipe.yaml

          sleep 1.1
          run > /dev/null
          [ "$before_s" = "$(stat -c %Y reuse_outdir/docs/samples.tsv)" ] \
            || { echo "samples.tsv was rewritten unchanged"; exit 1; }
          [ "$before_c" = "$(stat -c %Y reuse_outdir/docs/contigs.tsv)" ] \
            || { echo "contigs.tsv was rewritten unchanged"; exit 1; }
          grep -q 'EDITED_BY_OPERATOR' reuse_outdir/locopipe.yaml \
            || { echo "init clobbered the operator's locopipe.yaml"; exit 1; }

          # Settle the cache: locopipe.yaml went absent -> present, so the first
          # -resume re-runs. The second must be cached, which is the baseline the
          # next assertion needs.
          run -resume > /dev/null
          out=$(run -resume)
          echo "$out" | grep -qi 'cached' \
            || { echo "$out" | tail -20; echo "an unchanged -resume did not reuse the task"; exit 1; }

          # Now edit the settings. Every analysis threshold lives in that file
          # and nextflow cannot otherwise see it, so this must NOT be cached.
          echo "# EDITED_AGAIN" >> reuse_outdir/locopipe.yaml
          out=$(run -resume)
          if echo "$out" | grep -qi 'cached' ; then
            echo "$out" | tail -20
            echo "an edited locopipe.yaml was ignored by -resume"; exit 1
          fi

          # ... and a changed sheet still updates the table
          sleep 1.1
          nextflow run . -c test/ci.config --sheet test/sample-sheet-onegroup.csv \
            --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" \
            --outdir reuse_outdir --threads 2 --launch false > /dev/null
          [ "$(stat -c %Y reuse_outdir/docs/samples.tsv)" != "$before_s" ] \
            || { echo "a changed sheet did not update samples.tsv"; exit 1; }
          rm -rf reuse_outdir
          echo "idempotent rerun OK"

      # The whole point is that the first run already uses the intended
      # settings, rather than analysing with the defaults and being redone.
      - name: Analysis settings are applied before the first run
        run: |
          set -euo pipefail
          rm -rf params_outdir
          cat > /tmp/over.yaml <<'YAML'
          subset_snp_list_global:
            n: 400
          snp_calling_global:
            minmaf: "0.01"
          YAML
          nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
            --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" \
            --outdir params_outdir --locoparams /tmp/over.yaml --threads 2 --launch false
          grep -qE '^  n: 400'        params_outdir/locopipe.yaml || { echo "subset n not applied"; exit 1; }
          grep -qE '^  minmaf: "0.01"' params_outdir/locopipe.yaml || { echo "minmaf not applied"; exit 1; }
          # only the named setting changed: pcangsd's own minmaf is untouched
          grep -qE '^  minmaf: 0.05'  params_outdir/locopipe.yaml || { echo "an unnamed minmaf was changed"; exit 1; }
          # the comments the operator reads must survive the edit: the real
          # locopipe.yaml carries 177 of them and a yaml round-trip would drop
          # every one
          grep -q 'KEEP_THIS_COMMENT' params_outdir/locopipe.yaml \
            || { echo "comments were lost"; exit 1; }
          echo "settings applied up front OK"

      # Upstream's config.yaml can be used as is. Its six run-specific keys are
      # placeholders ( /path/to/loco-pipe ) and pop_level: species, which would
      # not match the samples.tsv this front-end writes, so they are rewritten.
      - name: A complete upstream config is usable directly
        run: |
          set -euo pipefail
          rm -rf conf_outdir
          cat > /tmp/upstream.yaml <<'YAML'
          global:
            basedir: "/path/to/loco-pipe/toyfish"
            reference: "/path/to/loco-pipe/toyfish/reference/toy_refgen.fa"
            scriptdir: "/path/to/loco-pipe/workflow/scripts"
            sample_table: "sample_table.tsv"
            pop_level: "species"
            chr_table: "chr_table.tsv"
            gl_model: 1
          snp_calling_global:
            # MY_OWN_COMMENT
            minmaf: "0.02"
            pval: "1e-6"
          subset_snp_list_global:
            n: 250
          YAML
          nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
            --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" \
            --outdir conf_outdir --lococonfig /tmp/upstream.yaml --threads 2 --launch false
          C=conf_outdir/locopipe.yaml
          # the run-specific keys are rewritten ...
          grep -q "basedir: \"$PWD/conf_outdir\""    "$C" || { grep -n basedir "$C"; echo "basedir not rewritten"; exit 1; }
          grep -q 'pop_level: "population"'           "$C" || { echo "pop_level not rewritten"; exit 1; }
          grep -q 'sample_table: "samples.tsv"'       "$C" || { echo "sample_table not rewritten"; exit 1; }
          grep -q 'chr_table: "contigs.tsv"'          "$C" || { echo "chr_table not rewritten"; exit 1; }
          if grep -q '/path/to/loco-pipe' "$C" ; then echo "a placeholder path survived"; exit 1; fi
          # ... and the analysis settings are used exactly as written
          grep -q 'minmaf: "0.02"'   "$C" || { echo "my minmaf was not used"; exit 1; }
          grep -q 'n: 250'           "$C" || { echo "my subset n was not used"; exit 1; }
          grep -q 'MY_OWN_COMMENT'   "$C" || { echo "my comments were lost"; exit 1; }
          rm -rf conf_outdir
          echo "upstream config used directly OK"

      # A typo must fail, not quietly leave the run on the defaults.
      - name: An unknown setting is rejected
        run: |
          set -euo pipefail
          printf 'subset_snp_list_global:\n  nn: 400\n' > /tmp/bad.yaml
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
                  --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" \
                  --outdir params_outdir --locoparams /tmp/bad.yaml --threads 2 --launch false 2>&1) \
            && { echo "expected failure"; exit 1; }
          echo "$out" | grep -q 'do not exist in' || { echo "$out" | tail -20; exit 1; }

          # the likeliest mistake with a commented reference file: uncommenting
          # a setting but not its section header, which lifts it to the top
          # level. The error has to name that, not just say "wrong shape".
          printf 'threads: 24\n' > /tmp/nosection.yaml
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
                  --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" \
                  --outdir params_outdir --locoparams /tmp/nosection.yaml --threads 2 --launch false 2>&1) \
            && { echo "expected failure"; exit 1; }
          echo "$out" | grep -q 'section header is probably still commented out' \
            || { echo "$out" | tail -20; echo "the error does not name the likely fix"; exit 1; }
          echo "$out" | grep -q "belongs to:" \
            || { echo "$out" | tail -20; echo "the error does not say which sections have it"; exit 1; }

          # The same mistake one section further in: the uncommented setting is
          # indented, so instead of reaching the top level it joins the section
          # above it. Both the section and the setting are real, they just do
          # not go together, so "no such setting" alone explains nothing.
          printf 'subset_snp_list_local:\n  n: 5000\n  threads: 24\n' > /tmp/bledin.yaml
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
                  --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" \
                  --outdir params_outdir --locoparams /tmp/bledin.yaml --threads 2 --launch false 2>&1) \
            && { echo "expected failure"; exit 1; }
          echo "$out" | grep -q 'section header is probably still commented out' \
            || { echo "$out" | tail -20; echo "the error does not name the likely fix"; exit 1; }
          # the section it was meant for is the next one down that has it
          echo "$out" | grep -q 'run_pcangsd_global:' \
            || { echo "$out" | tail -20; echo "the error does not guess the right section"; exit 1; }

          # a misspelt section should suggest the near match
          printf 'ostruct:\n  threads: 24\n' > /tmp/typo.yaml
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
                  --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" \
                  --outdir params_outdir --locoparams /tmp/typo.yaml --threads 2 --launch false 2>&1) \
            && { echo "expected failure"; exit 1; }
          echo "$out" | grep -q 'did you mean lostruct' \
            || { echo "$out" | tail -20; echo "no near-match suggestion"; exit 1; }

          rm -rf params_outdir
          echo "unknown setting rejected"

      # The way to check a real dataset before committing hours to it: lay
      # everything out, apply the settings, ask snakemake what it would run, and
      # produce nothing.
      - name: A dry run validates the configuration without analysing
        run: |
          set -euo pipefail
          rm -rf dry_outdir
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
                  --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" \
                  --outdir dry_outdir --threads 2 --id DRYTEST --dryrun true 2>&1)
          echo "$out" | grep -q 'DRY RUN' || { echo "$out" | tail -30; echo "no dry run notice"; exit 1; }
          # the project is laid out and the tables written ...
          test -f dry_outdir/docs/samples.tsv || { echo "tables not written"; exit 1; }
          test -f dry_outdir/locopipe.yaml    || { echo "config not written"; exit 1; }
          # ... but nothing was analysed, and no report was rendered
          if [ -d dry_outdir/figures ] ; then echo "a dry run produced figures"; exit 1 ; fi
          # a distinct --id: earlier steps leave their own report in
          # pipeline_info, and a glob would match theirs rather than test this
          if [ -f pipeline_info/DRYTEST-loco-report.html ] ; then
            echo "a dry run rendered a report"; exit 1
          fi
          rm -rf dry_outdir
          echo "dry run OK"

      - name: A prepared outdir is reused on the next run
        run: |
          set -euo pipefail
          # carries on from the --launch false run above, same outdir
          test -d locopipe
          nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
            --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" \
            --threads 2 --launch true
          test -d locopipe/figures || { echo "second run did not analyse"; exit 1; }
          echo "outdir reuse OK"

      # The bug this guards against: `loco-pipe start` exits 0 even when the
      # workflow failed, so without the log check a failed run looks successful.
      - name: A failed loco-pipe run is not reported as success
        run: |
          set -euo pipefail
          rm -rf locopipe
          export FAKE_FAIL=1
          nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
            --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" --threads 2 \
            && { echo "a failed loco-pipe run was reported as success"; exit 1; }
          echo "failure detection OK"

      # lostruct dies with "invalid value of 'n'" once a genome yields more than
      # 46340 windows, at the end of a run that has already done everything
      # else. The message names neither windows nor any setting, so the failure
      # has to be translated into the thing to change.
      - name: The lostruct window ceiling explains itself
        run: |
          set -euo pipefail
          rm -rf locopipe
          export FAKE_LOSTRUCT=1
          out=$(nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
                  --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" \
                  --threads 2 2>&1) \
            && { echo "the lostruct failure was reported as success"; exit 1; }
          echo "$out" | grep -q 'lostruct window ceiling' \
            || { echo "$out" | tail -30; echo "the failure was not explained"; exit 1; }
          # the count it actually produced, and a factor to raise the setting by
          echo "$out" | grep -q '50000 windows' \
            || { echo "$out" | tail -30; echo "the window count was not reported"; exit 1; }
          echo "$out" | grep -q 'snp_window_size' \
            || { echo "$out" | tail -30; echo "the setting to change was not named"; exit 1; }
          echo "lostruct ceiling explained OK"

      # snakemake writes a source cache under $HOME/.cache and dies at DAG
      # construction if $HOME is read-only, which it is inside a container on
      # many clusters. The run must not depend on a writable home.
      # The launcher itself needs a writable $HOME, so this cannot be tested by
      # making HOME read-only - that breaks nextflow before the task runs, which
      # is not the situation on a cluster ( there the launcher is on the host and
      # only the container sees a read-only home ). Instead, hand the run an
      # unusable XDG_CACHE_HOME: the task must override it with a task-local one,
      # and the fake asserts the one it receives is actually writable.
      - name: An unwritable cache directory is overridden
        run: |
          set -euo pipefail
          rm -rf locopipe
          mkdir -p "$RUNNER_TEMP/rocache"
          chmod 555 "$RUNNER_TEMP/rocache"
          set +e
          out=$(XDG_CACHE_HOME="$RUNNER_TEMP/rocache" nextflow run . -c test/ci.config \
                  --sheet test/sample-sheet.csv --ref "$PWD/test/ref/ref.fa" \
                  --locopipebin "$PWD/test/bin/loco-pipe" --threads 2 2>&1)
          rc=$?
          set -e
          chmod 755 "$RUNNER_TEMP/rocache"
          if [ $rc -ne 0 ] ; then echo "$out" | tail -40 ; exit 1 ; fi
          echo "cache directory override OK"

      # loco-pipe start exits 0 even when snakemake did nothing at all, so a
      # clean exit with no results has to be treated as a failure.
      - name: A run that produces nothing is not reported as success
        run: |
          set -euo pipefail
          rm -rf locopipe
          export FAKE_EMPTY=1
          nextflow run . -c test/ci.config --sheet test/sample-sheet.csv \
            --ref "$PWD/test/ref/ref.fa" --locopipebin "$PWD/test/bin/loco-pipe" --threads 2 \
            && { echo "a run that produced nothing was reported as success"; exit 1; }
          echo "empty run detection OK"

      - name: Stub run
        run: |
          nextflow run . -stub-run -c test/ci.config --report true \
            --sheet test/sample-sheet.csv \
            --ref   "$PWD/test/ref/ref.fa" \
            --id    CI_TEST
          test -f pipeline_info/CI_TEST-loco-report.html || {
            echo "the report was not published"; exit 1; }
          echo "report wiring OK"

      - name: Shell scripts lint
        run: |
          set -euo pipefail
          bash -n containers/build-sif.sh
          bash -n containers/toy-test.sh
          bash -n test/make_test_data.sh
          bash -n test/fake-locopipe
          bash -n toyfish/make-sheet.sh

  report:
    name: render the report (sartools image)
    runs-on: ubuntu-latest
    # quarto, R, DT and ImageMagick all live in this image, which is what the
    # pipeline renders with, so CI exercises the real thing rather than a
    # stand-in.
    container:
      image: ghcr.io/bixbeta/sartools:latest
    # the image's default shell is dash, which has no `set -o pipefail`
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Build a fixture results directory
        run: |
          set -euo pipefail
          FIX=$PWD/fixture
          mkdir -p $FIX/docs \
                   $FIX/figures/depth $FIX/figures/heterozygosity \
                   $FIX/figures/pcangsd/global $FIX/figures/pcangsd/local \
                   $FIX/figures/sfs $FIX/figures/fst \
                   $FIX/figures/lostruct/global
          png() { convert -size 40x30 xc:white "$1" ; }
          png $FIX/figures/depth/depth_filter.png
          png $FIX/figures/heterozygosity/heterozygosity.png
          png $FIX/figures/pcangsd/global/combined.subsetted.png
          png $FIX/figures/pcangsd/local/alpha.combined.subsetted.png
          png $FIX/figures/pcangsd/local/beta.combined.subsetted.png
          # ohana is the one portrait figure, and the reason sizing is per-image
          mkdir -p $FIX/figures/ohana/global
          convert -size 135x210 xc:white $FIX/figures/ohana/global/combined.subsetted.png
          png $FIX/figures/sfs/alpha.sfs.png
          png $FIX/figures/sfs/beta.sfs.png
          png $FIX/figures/fst/alpha.beta.png
          png $FIX/figures/lostruct/global/combined.mds.png
          # a PDF figure, as lostruct really emits, to exercise the conversion
          convert -size 40x30 xc:white $FIX/figures/lostruct/global/separated.pca.pdf
          printf 'sample_name\tbam\tpopulation\nS1\t/x/S1.bam\talpha\nS2\t/x/S2.bam\tbeta\n' > $FIX/docs/samples.tsv
          printf 'chr_big\t1\nchr_mid\t2\n' > $FIX/docs/contigs.tsv
          cat > $FIX/locopipe.yaml <<'YAML'
          global:
            gl_model: 1
          snp_calling_global:
            minind_proportion: "0.5"
            minmaf: "0.05"
            pval: "1e-6"
          get_depth_filter_global:
            n_sd: 2
          get_fst:
            snp_window_size: 100
            bp_window_size: 10000
          YAML
          echo "fixture ready"

      # Runs the real template, with the three variables nextflow would supply,
      # so the shipped script is what gets exercised.
      - name: Render
        run: |
          set -euo pipefail
          FIX=$PWD/fixture
          # substitute exactly what nextflow substitutes: the ${...} references
          # and the \$ escapes. Line continuations must survive untouched - an
          # earlier version of this stripped them and hid a real bug.
          sed -e "s|\${qmd}|$PWD/qmds/loco-report.qmd|g" \
              -e "s|\${outdir}|$FIX|g" \
              -e "s|\${id}|CI_TEST|g" \
              -e 's|\\\$|$|g' \
              modules/report/templates/makeReport.sh > /tmp/render.sh
          bash -n /tmp/render.sh
          # no stray backslash may survive as an argument
          if grep -qE '(^|[^\\])\\\\$' /tmp/render.sh ; then
            echo "doubled line continuation in makeReport.sh"; exit 1
          fi
          # $HOME is read-only inside the container on the cluster, and quarto
          # caches under it. This job runs as root, where a chmod'd directory is
          # still writable, so the read-only case cannot be reproduced here -
          # assert the script does not depend on a writable home instead.
          grep -q 'export HOME=' /tmp/render.sh || {
            echo "makeReport.sh does not make HOME task-local"; exit 1; }
          grep -q 'export XDG_CACHE_HOME=' /tmp/render.sh || {
            echo "makeReport.sh does not make XDG_CACHE_HOME task-local"; exit 1; }
          mkdir -p /tmp/render && cd /tmp/render
          bash /tmp/render.sh
          test -f CI_TEST-loco-report.html || { echo "no report produced"; exit 1; }
          # lostruct's separated.pca is the one figure loco-pipe emits as a PDF,
          # so the report depends on this conversion. It used to fail silently
          # and show up as "this module was not run".
          test -f figures/lostruct/global/separated.pca.png \
            || { echo "the pdf figure was not converted"; exit 1; }
          echo "rendered $(du -h CI_TEST-loco-report.html | cut -f1)"

      - name: The report is self contained and complete
        run: |
          set -euo pipefail
          H=/tmp/render/CI_TEST-loco-report.html
          # embed-resources: no external image references left
          if grep -qE '<img[^>]+src="(figures|\./figures)' "$H" ; then
            echo "figures were linked rather than embedded"; exit 1
          fi
          grep -q 'Sample Tracking'       "$H" || { echo "no sample tracking"; exit 1; }
          grep -q 'Analysis settings'     "$H" || { echo "no settings"; exit 1; }
          grep -q 'Depth and site filtering' "$H" || { echo "no depth section"; exit 1; }
          grep -q 'Population structure'  "$H" || { echo "no structure"; exit 1; }
          grep -q 'Local PCA'             "$H" || { echo "no local pca"; exit 1; }
          # the paginator has to reach the html, or the tabsets are unusable
          grep -q 'tab-navigator'         "$H" || { echo "paginator missing"; exit 1; }
          # theta was absent from the fixture: the section must say so, not fail
          # theta was absent from the fixture: the note must name the file, so a
          # module that was switched off is distinguishable from output that
          # landed somewhere unexpected
          grep -q 'Not produced' "$H" || { echo "missing-module note absent"; exit 1; }
          grep -qE 'Not produced: (no [a-z]+ found|`[^`]+` is missing)' "$H" \
            || { echo "the missing-output note does not say what is missing"; exit 1; }
          # sizing is decided per image: landscape figures constrained by width,
          # the portrait ohana panel by height, so it does not run down the page
          grep -qE 'width="?[0-9]+"?' "$H" || { echo "no width applied to landscape figures"; exit 1; }
          grep -qE 'height="?[0-9]+"?' "$H" || { echo "portrait figure not constrained by height"; exit 1; }
          echo "report content OK"
