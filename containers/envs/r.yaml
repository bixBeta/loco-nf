# Merge of the pipeline's workflow/envs/r.yaml and workflow/envs/lostruct.yaml.
# Both pin the same r-essentials / tidyverse / cowplot versions, so one R
# installation satisfies both rules and halves the image size.
name: r
channels:
  - conda-forge
dependencies:
  # --- from workflow/envs/r.yaml ---
  - r-essentials==4.2
  - r-tidyverse==2.0.0
  - r-cowplot==1.1.1
  - r-matrix==1.5_3
  - r-fitdistrplus==1.1_8
  - r-extraDistr==1.9.1
  - r-survival==3.5_3
  - mkl==2023.2.0
  - r-stringi==1.8.4
  - r-mass
  # --- from workflow/envs/lostruct.yaml ---
  - r-devtools==2.4.5
  - r-data.table==1.15.4
  - r-rspectra==0.16_1
